      }).join('')}
      <span class="text-[11px] font-bold ${cntOf(field,s.id,n)>=4?'text-green-700':'text-gray-300'} mb-2 w-12 text-right flex-shrink-0">${cntOf(field,s.id,n)}/7<br>${cntOf(field,s.id,n)>=4?'통과':'미달'}</span>
    </div>`;
  return `<div class="card !p-3">
    ${compact ? '' : `<div class="flex items-center gap-2 mb-2">
      <span class="font-bold text-gray-800 text-sm">${s.name}</span>
      ${s.role ? `<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-gray-100 text-gray-600">${s.role}</span>` : ''}
    </div>`}
    <div class="grid grid-cols-2 gap-1.5">
      <div class="min-w-0">
        <p class="text-[11px] text-gray-400 mb-0.5 truncate">금요철야 ${fmt(addDays(wi.sun,5))}</p>
        <div class="check-cell ${smFri?'gate-'+smFri:'st-빈칸'} w-full ${edit?'':'opacity-70'}" onclick="cycleSermon('${s.id}',${n},'fri')">${smFri || '·'}</div>
      </div>
      <div class="min-w-0">
        <p class="text-[11px] text-gray-400 mb-0.5 truncate">주일 설교 ${fmt(wi.sun)}</p>
        <div class="check-cell ${smSun?'gate-'+smSun:'st-빈칸'} w-full ${edit?'':'opacity-70'}" onclick="cycleSermon('${s.id}',${n},'sun')">${smSun || '·'}</div>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[11px] text-gray-400 mb-0.5 truncate">D형 (주 1회)</p>
        <div class="check-cell ${dq?'gate-O':'st-빈칸'} w-full ${edit?'':'opacity-70'}" onclick="toggleDqtWeek('${s.id}',${n})">${dq ? '통과' : '미달'}</div>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[11px] text-gray-400 mb-0.5 truncate">토요일 모임 ${fmt(wi.sat)}</p>
        <div class="check-cell ${a?'st-'+a:'st-빈칸'} w-full ${edit?'':'opacity-70'}" onclick="cycleAtt('${s.id}',${n})">${a || '·'}</div>
      </div>
    </div>
    ${dotRow('큐티','qt','on')}
    ${dotRow('기도일지','pray','on-p')}
  </div>`;
}

function renderCheck() {
  const el = document.getElementById('page-check');
  if (!canSeeCheck()) { navigate('home'); return; }
  const n = checkWeek, wi = weekInfo(n);
  const tabs = `<div class="scroll-table -mx-1 px-1"><div class="flex gap-1.5 pb-1">
    ${Array.from({length:WEEKS}, (_,i) => `<button onclick="checkWeek=${i};renderAll()"
      class="px-3 py-2 rounded-xl text-xs font-bold flex-shrink-0 ${i===n?'bg-gray-900 text-white':'bg-white text-gray-600 border'}">${i+1}주</button>`).join('')}
  </div></div>`;

  const rows = state.students.map(s => checkCard(s, n, false)).join('');

  const totals = `
    <div class="card !p-0 overflow-hidden">
      <div class="scroll-table">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b">
            <tr>${['이름','출석','지각','무지','결석','무결','금철','주일','큐티','D형','기도'].map(h =>
              `<th class="px-2 py-2 text-[11px] font-bold text-gray-500">${h}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${state.students.map(s => {
              const t = totalOf(s.id);
              const cell = (v, warn) => `<td class="px-2 py-2 text-center text-xs ${warn&&v?'text-red-600 font-bold':(v?'text-gray-800':'text-gray-300')}">${v}</td>`;
              return `<tr class="border-b last:border-0">
                <td class="px-2 py-2 font-semibold text-gray-800 text-xs whitespace-nowrap">${s.name}</td>
                ${cell(t.출석)}${cell(t.지각,1)}${cell(t.무단지각,1)}${cell(t.결석,1)}${cell(t.무단결석,1)}
                ${cell(t.sermonFri)}${cell(t.sermonSun)}${cell(t.qt)}${cell(t.dqt)}${cell(t.pray)}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-[11px] text-gray-400 px-3 py-2">지금까지 시작된 주(${totalOf(state.students[0].id).주차}주)를 모두 더한 값입니다.</p>
    </div>`;

  el.innerHTML = tabs + `
    <div class="card !py-3 bg-gray-50 border border-gray-200">
      <p class="text-sm font-bold text-gray-900">${n+1}주차 · ${fmt(wi.sun)}(일) ~ ${fmt(wi.sat)}(토)</p>
      <p class="text-xs text-gray-700 mt-0.5">${isLeader()
        ? '칸을 누르면 상태가 바뀝니다 · 출석 → 지각 → 무단지각 → 결석 → 무단결석'
        : '반장은 보기만 할 수 있습니다 · 고치는 것은 목사님만'}</p>
    </div>` + rows + totals;
}

// ==========================================
// 안내
// ==========================================
// ==========================================
// 작은 도구들
// ==========================================
function openModal(id) {
  if (id === 'modal-settings') {
    document.getElementById('set-start-date').value = startDate();
    updateSettingsPreview();
  }
  document.getElementById(id).classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function updateSettingsPreview() {
  const v = document.getElementById('set-start-date').value;
  const p = document.getElementById('settings-preview');
  if (!v) { p.textContent = ''; return; }
  const d = parseDate(v);
  if (d.getDay() !== 0) { p.textContent = '⚠️ 주일이 아닙니다'; return; }
  p.textContent = `1주차 ${fmt(d)}(일) ~ ${WEEKS}주차 ${fmt(addDays(d, (WEEKS-1)*7+6))}(토)`;
}
function toast(msg, ms) {
  let el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:99999;max-width:88%;background:rgba(30,30,40,.94);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, ms || 2400);
}
// PC에서 ESC를 누르면 열려 있는 팝업이 닫힌다.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const open = document.querySelectorAll('.modal.open');
  if (!open.length) return;
  e.preventDefault();
  open.forEach(m => m.classList.remove('open'));
});
// 어떤 예외가 나도 앱이 통째로 멈추지 않게 한다.
window.addEventListener('error', e => console.warn('[전역오류]', e.error || e.message));
window.addEventListener('unhandledrejection', e => console.warn('[전역오류:promise]', e.reason));

// ==========================================
// 시작
// ==========================================
try {
  const _badge = document.getElementById('build-badge');
  if (_badge) _badge.textContent = 'v' + APP_BUILD;
  window.APP_BUILD = APP_BUILD;
} catch (_) {}

document.getElementById('set-start-date').addEventListener('change', updateSettingsPreview);

loadLocal();
// 코드의 명단이 저장본보다 최신이면 빠진 사람을 채운다
state.students = ROSTER.map(r => Object.assign({}, r, (state.students || []).find(s => s.id === r.id) || {}));
fillLoginSelect();
resetDates();

// 자정이 지나면 그날 칸이 닫힌다. 앱을 켜 둔 채 날이 바뀌어도 화면이 따라가도록
// 다음 자정에 한 번 다시 그린다.
function scheduleDayRollover() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
  setTimeout(() => {
    resetDates();
    if (currentUser) renderAll();
    scheduleDayRollover();
  }, Math.max(1000, next - now));
}
scheduleDayRollover();

try {
  const saved = localStorage.getItem('hwakma_user');
  if (saved && findUser(saved)) {
    currentUser = saved;
    document.getElementById('login-screen').style.display = 'none';
    renderAll();
    watchNotes();
  }
} catch (_) {}

initFirestore();
initGallery();

// ==========================================
// 앱 자동 업데이트 (새로고침 루프 차단 포함)
// ==========================================
if ('serviceWorker' in navigator) {
  let _reloading = false;
  const _hadController = !!navigator.serviceWorker.controller;
  const _RELOAD_LOG_KEY = 'hwakma_auto_reloads';

  function _reloadHistory() {
    try { return JSON.parse(sessionStorage.getItem(_RELOAD_LOG_KEY) || '[]'); } catch (_) { return []; }
  }
  function _noteReload(to) {
    try {
      const log = _reloadHistory().concat({ t: Date.now(), from: APP_BUILD, to }).slice(-5);
      sessionStorage.setItem(_RELOAD_LOG_KEY, JSON.stringify(log));
    } catch (_) {}
  }
  async function _serverBuild() {
    try {
      const res = await fetch('./sw.js?ts=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return null;
      const m = (await res.text()).match(/APP_BUILD\s*=\s*['"]([^'"]+)['"]/);
      return m ? m[1] : null;
    } catch (_) { return null; }
  }
  // 쓰다 만 글이나 아직 못 올린 체크가 있으면 새로고침을 미룬다.
  function _safeToReload() {
    if (_pendingPatch) return false;
    if (_pendingImg) return false;
    if (Object.keys(_draft).length) return false;
    if (_timer.id) return false;
    return true;
  }
  function _reloadWhenSafe(to) {
    if (_reloading) return;
    if (!_safeToReload()) { setTimeout(() => _reloadWhenSafe(to), 4000); return; }
    _reloading = true;
    _noteReload(to);
    location.reload();
  }
  async function _maybeReloadForNewBuild() {
    if (_reloading) return;
    if (_reloadHistory().filter(r => Date.now() - r.t < 300000).length >= 2) {
      console.warn('[업데이트] 자동 새로고침이 반복돼 이번 세션에서는 중단합니다.');
      return;
    }
    const server = await _serverBuild();
    if (!server || server === APP_BUILD) return;
    _reloadWhenSafe(server);
  }
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_hadController) _maybeReloadForNewBuild();
  });

  let _swReg = null;
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
    .then(reg => {
      _swReg = reg;
      reg.update().catch(() => {});
      const nudge = () => { if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); };
      nudge();
      reg.addEventListener('updatefound', () => {
        if (reg.installing) reg.installing.addEventListener('statechange', nudge);
      });
    })
    .catch(() => {});

  let _lastUpdateCheck = 0;
  function _checkForUpdate() {
    if (!_swReg || document.visibilityState !== 'visible') return;
    if (Date.now() - _lastUpdateCheck < 60000) return;
    _lastUpdateCheck = Date.now();
    _swReg.update().catch(() => {});
  }
  document.addEventListener('visibilitychange', _checkForUpdate);
  window.addEventListener('pageshow', _checkForUpdate);
  window.addEventListener('focus', _checkForUpdate);
}
</script>
