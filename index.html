<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .page { display: none; }
  .page.active { display: block; }

  /* 출석 상태 */
  .st-출석 { background:#DBEAFE; color:#1D4ED8; font-weight:600; }
  .st-지각 { background:#FEF9C3; color:#B45309; font-weight:600; }
  .st-무단지각 { background:#FDBA74; color:#7C2D12; font-weight:700; }
  .st-결석 { background:#FEE2E2; color:#DC2626; font-weight:600; }
  .st-무단결석 { background:#F87171; color:#7F1D1D; font-weight:700; }
  .st-빈칸 { background:#F9FAFB; color:#9CA3AF; }

  .gate-O { background:#DCFCE7; color:#166534; font-weight:700; }
  .gate-X { background:#FEE2E2; color:#DC2626; font-weight:700; }

  .check-cell {
    min-width: 38px; min-height: 38px; text-align:center; padding:2px;
    font-size:13px; border-radius:6px; cursor:pointer; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  .dot7 {
    height:30px; border-radius:8px; font-size:12px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    border:1px solid #E5E7EB; background:#F9FAFB; color:#9CA3AF;
  }
  .dot7.on { background:#DBEAFE; border-color:#93C5FD; color:#1D4ED8; }
  .dot7.on-d { background:#EDE9FE; border-color:#C4B5FD; color:#6D28D9; }
  .dot7.on-p { background:#DCFCE7; border-color:#86EFAC; color:#15803D; }

  .nav-btn.active svg { stroke:#111827; }
  .nav-btn.active span { color:#111827; }
  .scroll-table { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table th, table td { white-space:nowrap; }

  #login-screen { display:flex; }
  .pin-input { letter-spacing:0.5em; font-size:1.5rem; text-align:center; }

  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; }
  .modal.open { display:flex; }

  input[type="text"], input[type="date"], input[type="tel"], select, textarea {
    border:1px solid #D1D5DB; border-radius:8px; padding:8px 12px; font-size:14px; width:100%; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:#111827; box-shadow:0 0 0 2px rgba(17,24,39,0.15); }
  button, .btn { min-height:44px; }
  .nav-btn { min-height:unset; }
  .card { background:#fff; border-radius:12px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04); padding:16px; }
  .phone-detail summary { list-style:none; }
  .phone-detail summary::-webkit-details-marker { display:none; }

  /* D형 큐티 4단계 색 — 관찰(파랑) 해석(보라) 느낀점(주황) 적용(초록) */
  .step-obs  { border-left:4px solid #60A5FA; }
  .step-int  { border-left:4px solid #A78BFA; }
  .step-feel { border-left:4px solid #FBBF24; }
  .step-app  { border-left:4px solid #34D399; }
  .step-badge { font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
  .b-obs  { background:#DBEAFE; color:#1D4ED8; }
  .b-int  { background:#EDE9FE; color:#6D28D9; }
  .b-feel { background:#FEF3C7; color:#B45309; }
  .b-app  { background:#D1FAE5; color:#047857; }

  /* 목사님이 남기는 한마디 — 홈에서 사진 바로 아래 놓인다 */
  .notice-card {
    background:#0E0E13; border-radius:16px; padding:18px 18px 16px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.07);
    border-left:3px solid rgba(255,255,255,.55);
  }
  .notice-text {
    color:#fff; font-size:16px; line-height:1.7; font-weight:600;
    letter-spacing:-.01em; word-break:keep-all;
  }

  .timer-num { font-variant-numeric: tabular-nums; font-size:44px; font-weight:800; letter-spacing:-.02em; }

<body class="bg-gray-50">

<header class="text-white px-4 py-3 fixed top-0 left-0 right-0 z-50 shadow-md" style="background:#0B0B0C">
  <div class="flex items-center justify-between max-w-2xl mx-auto">
    <h1 class="text-lg font-bold cursor-pointer active:opacity-70" onclick="navigate('home')">확~마! 제자반</h1>
    <div class="flex items-center gap-2">
      <div id="header-week" class="text-sm px-3 py-1 rounded-full" style="background:rgba(255,255,255,.12)"></div>

    </div>
  </div>
</header>

<main class="pt-14 pb-20 max-w-2xl mx-auto" id="main-content">

    <div id="qt-daily" class="space-y-4"></div>
    <div id="page-dqt" class="space-y-4"></div>
  </div>
  <div id="page-pray" class="page p-4 space-y-4"></div>
  <div id="page-sermon" class="page p-4 space-y-4"></div>
  <div id="page-gallery" class="page p-4 space-y-4"></div>
  <div id="page-bday" class="page p-4 space-y-4"></div>
  <div id="page-check" class="page p-4 space-y-4"></div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 shadow-lg">
  <div class="flex justify-around items-center max-w-2xl mx-auto py-1">

<!-- Login -->
<div id="login-screen" class="fixed inset-0 z-[300] flex items-center justify-center bg-black">
  <div id="build-badge" class="absolute bottom-4 left-0 right-0 text-center text-[11px] text-white/40 select-text"></div>
  <div class="bg-white rounded-3xl w-full max-w-sm mx-4 overflow-hidden shadow-2xl">
    <div class="bg-black p-6 text-center">
      <div class="text-4xl mb-2">✝️</div>
      <h1 class="text-xl font-bold text-white">확~마! 제자반</h1>
      <p class="text-white/70 text-sm mt-1">말씀 · 기도 · 삶</p>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <label class="text-xs text-gray-500 font-semibold mb-1 block">이름 선택</label>
        <select id="login-name-select" class="w-full border rounded-xl p-3 text-sm">
          <option value="">이름을 선택하세요</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 font-semibold mb-1 block">PIN 번호 (4자리)</label>
        <input type="password" id="login-pin" maxlength="4" inputmode="numeric" placeholder="● ● ● ●"
               class="pin-input w-full border rounded-xl p-3" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <p id="login-error" class="text-xs text-red-500 text-center hidden">PIN 번호가 올바르지 않습니다</p>
      <button onclick="doLogin()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">로그인</button>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
        <p class="text-xs text-amber-800 leading-relaxed">처음 PIN은 <b>0000</b>입니다.
        누구나 눌러볼 수 있는 번호이니 <b>로그인하면 꼭 바꿔주세요.</b> 이름 → PIN 번호 변경.</p>
      </div>
    </div>
  </div>
</div>

<!-- 지면 크게 보기 -->
<div id="modal-img" class="modal" onclick="closeModal('modal-img')">
  <div class="flex items-center justify-center w-full h-full p-3">
    <img id="modal-img-src" src="" class="max-w-full max-h-[92vh] rounded-xl object-contain shadow-2xl">
  </div>
</div>

<!-- 새 댓글 알림 -->
<div id="modal-newnotes" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-sm mx-4 max-h-[80vh] flex flex-col overflow-hidden">

    </div>

    <div class="p-4 pt-2 flex gap-2 border-t">
      <button onclick="goToNewNote()" class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">확인하러 가기</button>
      <button onclick="dismissNewNotes()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-sm">나중에</button>
    </div>
  </div>
</div>

<!-- User menu -->
<div id="modal-user-menu" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-xs mx-4">
    <div class="p-4 border-b">
      <p class="font-bold text-gray-800" id="user-menu-name">내 계정</p>
      <p class="text-xs text-gray-500 mt-0.5" id="user-menu-role"></p>
    </div>
    <div class="p-2">
      <button onclick="closeModal('modal-user-menu');openModal('modal-pin')" class="w-full text-left px-4 py-3 text-sm text-gray-700 rounded-xl active:bg-gray-50">🔐 PIN 번호 변경</button>
      <button id="btn-settings" onclick="closeModal('modal-user-menu');openModal('modal-settings')" class="w-full text-left px-4 py-3 text-sm text-gray-700 rounded-xl active:bg-gray-50 hidden">📅 제자반 시작 주일 설정</button>
      <button onclick="doLogout()" class="w-full text-left px-4 py-3 text-sm text-red-600 rounded-xl active:bg-gray-50">로그아웃</button>
      <button onclick="closeModal('modal-user-menu')" class="w-full text-left px-4 py-3 text-sm text-gray-400 rounded-xl active:bg-gray-50">닫기</button>
    </div>
  </div>
</div>

<!-- PIN change -->
<div id="modal-pin" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-xs mx-4">
    <div class="p-4 border-b flex items-center justify-between">
      <h3 class="font-bold text-gray-800">PIN 변경</h3>
      <button onclick="closeModal('modal-pin')" class="text-gray-400 text-2xl leading-none">×</button>
    </div>
    <div class="p-4 space-y-3">
      <div><label class="text-xs text-gray-500 font-semibold mb-1 block">현재 PIN</label>
        <input type="password" id="pin-current" maxlength="4" inputmode="numeric" placeholder="● ● ● ●" class="pin-input w-full border rounded-xl p-3"></div>
      <div><label class="text-xs text-gray-500 font-semibold mb-1 block">새 PIN</label>
        <input type="password" id="pin-new" maxlength="4" inputmode="numeric" placeholder="● ● ● ●" class="pin-input w-full border rounded-xl p-3"></div>
      <p id="pin-error" class="text-xs text-red-500 hidden text-center"></p>
    </div>
    <div class="p-4 pt-0 flex gap-2">
      <button onclick="doChangePIN()" class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">변경</button>
      <button onclick="closeModal('modal-pin')" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-sm">취소</button>
    </div>
  </div>
</div>

<!-- Settings (인도자) -->
<div id="modal-settings" class="modal">
  <div class="bg-white rounded-2xl w-full max-w-xs mx-4">
    <div class="p-4 border-b flex items-center justify-between">
      <h3 class="font-bold text-gray-800">제자반 시작 주일</h3>
      <button onclick="closeModal('modal-settings')" class="text-gray-400 text-2xl leading-none">×</button>
    </div>
    <div class="p-4 space-y-2">
      <p class="text-xs text-gray-500 leading-relaxed">제자반 첫 주의 <b>주일</b>을 고르세요. 한 주는 <b>주일부터 토요일까지</b>입니다 — 주일 설교 노트로 열고, 매일 큐티와 기도일지를 쓰고, 토요일 모임으로 닫습니다.</p>
      <input type="date" id="set-start-date">
      <p id="settings-preview" class="text-xs text-gray-700 font-semibold"></p>
    </div>
    <div class="p-4 pt-0 flex gap-2">
      <button onclick="doSaveStartDate()" class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-bold text-sm">저장</button>
      <button onclick="closeModal('modal-settings')" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-sm">취소</button>
    </div>
  </div>
</div>

let _pendingPatch = null, _patchTimer = null, _saveRetry = 0;
function pushPatch(patch) {
  Object.assign(state, mergeDeep(state, patch));
  saveLocal();
  if (!_FS_OK) return;
  _pendingPatch = mergeDeep(_pendingPatch || {}, patch);
  clearTimeout(_patchTimer);
  _patchTimer = setTimeout(flushPatch, 400);
}
function flushPatch() {
  if (!_pendingPatch) return;
  const payload = Object.assign({ schemaVersion: 1 }, _pendingPatch);
  _pendingPatch = null;
  _stateRef.set(payload, { merge: true })
    .then(() => { _saveRetry = 0; })
    .catch(e => {
      // 저장 실패를 조용히 버리지 않는다 — 다시 큐에 넣고 재시도한다.
      console.warn('저장 실패 — 재시도합니다:', e);
      _pendingPatch = mergeDeep(payload, _pendingPatch || {});
      delete _pendingPatch.schemaVersion;
      _saveRetry++;
      setTimeout(flushPatch, Math.min(1500 * _saveRetry, 15000));
    });
}
function mergeDeep(base, patch) {
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  Object.keys(patch || {}).forEach(k => {
    const v = patch[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) {
      out[k] = mergeDeep(out[k], v);
    } else {
      out[k] = v;
    }
  });
  return out;
}

let _fsTries = 0;
function initFirestore() {
  if (!_FS_OK) return;
  _stateRef.get().then(doc => {
    if (doc.exists) {
      applyRemote(doc.data());
    } else {
      _stateRef.set(Object.assign({}, state)).catch(e => console.warn('초기 업로드 실패:', e));
    }
    _stateRef.onSnapshot(d => {
      if (!d.exists) return;
      applyRemote(d.data());
      // 누가 글을 쓰는 중이면 화면을 다시 그리지 않는다 — 쓰던 글이 흔들리지 않도록.
      if (document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
      renderAll();
    }, e => console.warn('실시간 동기화 끊김:', e));
    renderAll();
  }).catch(e => {
    _fsTries++;
    console.warn(`Firestore 연결 실패 — ${_fsTries}번째 재시도 예정:`, e);
    setTimeout(initFirestore, Math.min(2000 * _fsTries, 20000));
  });
}
function applyRemote(data) {
  ['startDate','pins','att','qt','dqt','pray','sermon','profiles','notice','memos'].forEach(k => {
    if (data[k] !== undefined) state[k] = data[k];
  });
  if (Array.isArray(data.students) && data.students.length) {
    const byId = {};
    data.students.forEach(s => { byId[s.id] = s; });
    state.students = ROSTER.map(r => Object.assign({}, r, byId[r.id] || {}));
  }
  saveLocal();
}

function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmt(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function today0() { const t = new Date(); t.setHours(0,0,0,0); return t; }
function startDate() { return state.startDate || DEFAULT_START; }

// 한 주 = 주일부터 토요일까지 7일. 주일에 설교를 듣고, 토요일에 모인다.
function weekInfo(n) {
  const sun = addDays(parseDate(startDate()), n*7);
  return { n, sun, sat: addDays(sun,6) };
}
function weekKey(id, n) { return `${id}_w${n}`; }
function weekStarted(n) { return today0() >= weekInfo(n).sun; }
function weekEnded(n) { return today0() > weekInfo(n).sat; }
function currentWeek() {
  for (let n = 0; n < WEEKS; n++) if (!weekEnded(n)) return n;
  return WEEKS - 1;
}
// 날짜 → {n(주차), i(0=토 … 6=금)}. 제자반 기간 밖이면 null.
function slotOf(dateISO) {
  const diff = Math.round((parseDate(dateISO) - parseDate(startDate())) / 86400000);
  const n = Math.floor(diff / 7), i = ((diff % 7) + 7) % 7;
  if (n < 0 || n >= WEEKS) return null;
  return { n, i };
}
function dateOf(n, i) { return iso(addDays(weekInfo(n).sun, i)); }
function dayLabel(ds) {
  const d = parseDate(ds), s = slotOf(ds);
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${s ? DOW7[s.i] : ['일','월','화','수','목','금','토'][d.getDay()]})`;
}
// 오늘·어제까지만 쓴다. 어제 것은 '늦은 제출'로 표시한다.
// 매일 쓰는 것이 핵심이라 더 거슬러 올라가 몰아 쓰지는 못하게 한다.
function daysAgo(ds) { return Math.round((today0() - parseDate(ds)) / 86400000); }
function canWrite(ds) { if (canManage()) return true; const g = daysAgo(ds); return g === 0 || g === 1; }
function isLate(ds) { return daysAgo(ds) === 1; }
// 설교 노트는 예배일부터 그 주 토요일까지 연다.
function canWriteSermon(ds) {
  if (canManage()) return true;
  const s = slotOf(ds);
  return !!s && parseDate(ds) <= today0() && today0() <= weekInfo(s.n).sat;
}

function attOf(id, n) { return state.att[weekKey(id,n)] || ''; }
function sermonKey(id, n, type) { return `${weekKey(id,n)}_${type === 'fri' ? 'fri' : 'sun'}`; }
function sermonOf(id, n, type = 'sun') {
  const all = state.sermon || {};
  return all[sermonKey(id,n,type)] || (type === 'sun' ? all[weekKey(id,n)] : '') || '';
}
function arrOf(field, id, n) {
  const v = (state[field] || {})[weekKey(id,n)];
  return Array.isArray(v) && v.length === 7 ? v : [false,false,false,false,false,false,false];
}
function cntOf(field, id, n) { return arrOf(field, id, n).filter(Boolean).length; }
function qtOf(id,n)   { return arrOf('qt', id, n); }
// D형 큐티는 주 1회다. 낸 날짜가 들어 있으면 그 주는 낸 것이다.
// 날마다 체크하던 옛 방식의 [bool x7] 배열이 남아 있으면 안 낸 것으로 본다.
function dqtOf(id,n)   { const v = (state.dqt || {})[weekKey(id,n)]; return typeof v === 'string' ? v : ''; }
function dqtDone(id,n) { return !!dqtOf(id,n); }
function prayOf(id,n) { return arrOf('pray', id, n); }

// 이번 주 나의 한눈 요약
function weekSummary(id, n) {
  return { att: attOf(id,n), sermon: sermonOf(id,n),
           qt: cntOf('qt',id,n), dqt: dqtDone(id,n), pray: cntOf('pray',id,n) };
}
// 제자반 전체 기간 합계
function totalOf(id) {
  const t = { 출석:0, 지각:0, 무단지각:0, 결석:0, 무단결석:0, qt:0, dqt:0, pray:0, sermon:0, sermonFri:0, sermonSun:0, 주차:0 };
  for (let n = 0; n < WEEKS; n++) {
    if (!weekStarted(n)) continue;
    t.주차++;
    const a = attOf(id,n); if (a) t[a]++;
    t.qt += cntOf('qt',id,n);
    if (dqtDone(id,n)) t.dqt++;
    t.pray += cntOf('pray',id,n);
    if (sermonOf(id,n,'fri') === 'O') { t.sermon++; t.sermonFri++; }
    if (sermonOf(id,n,'sun') === 'O') { t.sermon++; t.sermonSun++; }
  }
  return t;
}

// ==========================================
const KINDS = {

  dqt:    { label:'D형 큐티',    field:null   },   // 주 1회라 날짜 칸이 따로 없다
  pray:   { label:'기도 영적일지', field:'pray' },
  sermon: { label:'주일 설교 노트', field:null  },
  bday:   { label:'생일 축하 글',    field:null  }
};
const _docs = {};      // `${kind}_${id}_${date}` → data | null
const _loading = {};

function hasContent(kind, doc) {
  if (!doc) return false;
  if (kind === 'qt')     return !!((doc.text||'').trim() || doc.image);
  if (kind === 'dqt')    return !!(doc.image || (doc.memo||'').trim());
  if (kind === 'pray')   return !!((doc.verse||'').trim() || (doc.read||'').trim() || (doc.question||'').trim() || (doc.feel||'').trim() || (doc.prayer||'').trim());
  if (kind === 'sermon') return !!(doc.image || (doc.title||'').trim() || (doc.memo||'').trim());
  if (kind === 'bday')   return !!(Array.isArray(doc.msgs) && doc.msgs.length);

}

// 제출하면 그날 체크가 함께 켜진다 — 냈는데 체크가 안 되는 일이 없도록.
function markCheck(kind, id, date, on) {
  const f = (KINDS[kind] || {}).field;
  if (kind !== 'sermon' && kind !== 'dqt' && !f) return;
  const s = slotOf(date);
  if (!s) return;
  if (kind === 'sermon') {
    const type = s.i === 5 ? 'fri' : 'sun';
    pushPatch({ sermon: { [sermonKey(id, s.n, type)]: on ? 'O' : '' } });
    return;
  }
  // D형은 주 1회 — 그 주 칸에 낸 날짜를 적는다.
  if (kind === 'dqt') { pushPatch({ dqt: { [weekKey(id, s.n)]: on ? date : '' } }); return; }
  const arr = arrOf(f, id, s.n).slice();
  arr[s.i] = !!on;
  pushPatch({ [f]: { [weekKey(id, s.n)]: arr } });
}

// ==========================================
// 사진 — 폰 원본 그대로면 너무 커서 저장이 거부된다. 긴 변 1000px·품질을 낮춰 줄인다.
// ⚠️ 폰 사진은 픽셀이 눕혀진 채 저장되고 'EXIF 방향' 표시로만 바로 선다.
//    캔버스에 그리면 그 표시가 사라지므로 imageOrientation:'from-image'로 펴 준다.
// ==========================================
function _shrinkToJpeg(src, max, budget) {
  const scale = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * scale);
  c.height = Math.round(src.height * scale);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  let q = 0.72, out = c.toDataURL('image/jpeg', q);
  while (out.length > budget && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
  return out;
}
function compressImage(file, cb) {
  const done = src => {
    try {
      const out = _shrinkToJpeg(src, 1000, 420000);
      if (src.close) src.close();
      cb(out.length > 700000 ? null : out);
    } catch (_) { cb(null); }
  };
  const fallback = () => {
    const reader = new FileReader();
    reader.onerror = () => cb(null);
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => cb(null);
      img.onload = () => done(img);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
  if (window.createImageBitmap) {
    createImageBitmap(file, { imageOrientation: 'from-image' }).then(done).catch(fallback);
  } else {
    fallback();
  }
}
function _rotate90(dataUrl, cb) {
  const img = new Image();
  img.onerror = () => cb(null);
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = img.height; c.height = img.width;
      const x = c.getContext('2d');
      x.translate(c.width / 2, c.height / 2);
      x.rotate(Math.PI / 2);
      x.drawImage(img, -img.width / 2, -img.height / 2);
      let q = 0.72, out = c.toDataURL('image/jpeg', q);
      while (out.length > 420000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      cb(out);
    } catch (_) { cb(null); }
  };
  img.src = dataUrl;
}
function pickImage(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  toast('사진을 줄이는 중이에요…');
  compressImage(f, dataUrl => {
    if (!dataUrl) { toast('사진이 너무 커요. 다른 사진으로 해볼래요?'); return; }
    _pendingImg = dataUrl;
    renderAll();

}
function clearImage() { _pendingImg = null; renderAll(); }
function rotateImage(kind, date) {
  const cur = _pendingImg || ((getDoc(kind, currentUser, date) || {}).image) || '';

async function uploadGallery(input) {

  }).join('');

  const text = val('qt-text');
  const image = _pendingImg || prev.image || '';
  if (!text && !image) { toast('묵상한 것을 적거나 사진을 올려주세요'); return; }
  _pendingImg = null;
  saveDoc('qt', id, date, { text, image, late: isLate(date) }, '큐티를 올렸어요!');
}
// D형 큐티는 공책에 손으로 쓰고, 그것을 찍어 올린다.
function submitDqt(date) {
  const id = currentUser;
  const sl = slotOf(date);
  if (!sl || !canWriteDqt(sl.n)) { toast('그 주는 닫혔어요'); renderAll(); return; }
  const prev = getDoc('dqt', id, date) || {};
  const d = { image: _pendingImg || prev.image || '', memo: val('dqt-memo'),
              applyDone: !!prev.applyDone, week: sl.n };
  if (!d.image) { toast('손으로 쓴 D형 큐티를 사진으로 올려주세요'); return; }
  _pendingImg = null;
  saveDoc('dqt', id, date, d, 'D형 큐티를 올렸어요!');
}
// 어제 공책에 적은 적용을 오늘 지켰는지 표시한다 — 적어만 두고 넘어가지 않도록.
function toggleApplyDone(id, date) {
  if (id !== currentUser && !canManage()) return;
  const prev = getDoc('dqt', id, date);
  if (!prev) return;
  const doc = Object.assign({}, prev, { applyDone: !prev.applyDone });
  _docs[dkey('dqt', id, date)] = doc;
  renderAll();
  if (!_FS_OK) return;
  _db.collection('discipleDocs').doc(dkey('dqt', id, date))
    .set({ applyDone: doc.applyDone }, { merge: true })
    .then(() => toast(doc.applyDone ? '지켰어요! 잘했습니다' : '체크를 풀었어요'))
    .catch(e => console.warn('적용 체크 저장 실패:', e));
}
function submitPray(date) {
  const id = currentUser;
  if (!canWrite(date)) { toast('그날은 닫혔어요'); renderAll(); return; }
  const d = { verse: val('pray-verse'), read: val('pray-read'), question: val('pray-question'),
              feel: val('pray-feel'), prayer: val('pray-prayer'),
              minutes: val('pray-minutes') || String(_timer.spent || ''), late: isLate(date) };
  if (!d.verse && !d.read && !d.question && !d.feel && !d.prayer) { toast('한 칸이라도 적어주세요'); return; }
  saveDoc('pray', id, date, d, '기도 영적일지를 올렸어요!');
}
// 설교 노트도 손으로 쓴 것을 찍어 올린다. 제목만 적으면 피드에서 알아보기 쉽다.
function submitSermon(date) {
  const id = currentUser;
  if (!canWriteSermon(date)) { toast('그 주일 노트는 닫혔어요'); renderAll(); return; }
  const prev = getDoc('sermon', id, date) || {};
  const d = { title: val('sm-title'), passage: val('sm-passage'), memo: val('sm-memo'),
              image: _pendingImg || prev.image || '' };
  if (!d.image) { toast('손으로 쓴 설교 노트를 사진으로 올려주세요'); return; }
  _pendingImg = null;
  saveDoc('sermon', id, date, d, '설교 노트를 올렸어요!');
}

// ==========================================
// 체크표 직접 고치기 — 인도자만
// ==========================================
function cycleAtt(id, n) {
  if (!isLeader()) return;
  const cur = attOf(id, n);
  const next = ATT_CYCLE[(ATT_CYCLE.indexOf(cur) + 1) % ATT_CYCLE.length];
  pushPatch({ att: { [weekKey(id,n)]: next } });
  renderAll();
}
function cycleSermon(id, n, type = 'sun') {
  if (!isLeader()) return;
  const cur = sermonOf(id, n, type);
  const next = cur === '' ? 'O' : (cur === 'O' ? 'X' : '');
  pushPatch({ sermon: { [sermonKey(id,n,type)]: next } });
  renderAll();
}
// D형은 주 1회라 한 칸으로 켜고 끈다.
function toggleDqtWeek(id, n) {
  if (!isLeader()) return;
  pushPatch({ dqt: { [weekKey(id,n)]: dqtDone(id,n) ? '' : dateOf(n, 0) } });
  renderAll();
}
function toggleDot(field, id, n, i) {
  if (!isLeader()) return;
  const arr = arrOf(field, id, n).slice();
  arr[i] = !arr[i];
  pushPatch({ [field]: { [weekKey(id,n)]: arr } });
  renderAll();
}

// 렌더링
// ==========================================
function navigate(page) {
  if (page === 'dqt') { page = 'qt'; qtSection = 'dqt'; }
  else if (page === 'qt') qtSection = 'daily';
  currentPage = page;
  _editingDoc = null; _delArm = null; _pendingImg = null;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pg = document.getElementById('page-' + page);
  if (pg) pg.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nav-' + page);
  if (nb) nb.classList.add('active');
  window.scrollTo(0, 0);
  renderAll();
}
function renderAll() {
  if (!currentUser) return;
  const u = findUser(currentUser);
  document.getElementById('header-user-name').textContent = u ? u.name : '';
  document.getElementById('user-menu-name').textContent = u ? u.name : '';
  document.getElementById('user-menu-role').textContent = isLeader() ? (u ? u.title : '인도자') : (u && u.role ? u.role : '제자반');
  document.getElementById('btn-settings').classList.toggle('hidden', !isLeader());
  document.getElementById('nav-check').classList.toggle('hidden', !canSeeCheck());
  document.getElementById('header-week').textContent = weekStarted(0) ? `${currentWeek()+1}주차` : '시작 전';
  paintNoteDots();
  ({ home: renderHome, qt: renderQT, dqt: renderDQT, pray: renderPray,
     sermon: renderSermon, gallery: renderGallery, bday: renderBday, check: renderCheck }[currentPage] || renderHome)();
}

// 안 읽은 댓글이 있는 메뉴에 빨간 점을 찍는다.
function paintNoteDots() {
  const byNav = { qt:'nav-qt', dqt:'nav-qt', sermon:'nav-sermon' };
  const want = {};
  _newNotes.forEach(x => { const id = byNav[x.target]; if (id) want[id] = (want[id] || 0) + 1; });
  ['nav-qt','nav-sermon'].forEach(id => {
    const btn = document.getElementById(id);
    if (!btn) return;
    let dot = btn.querySelector('.note-dot');
    if (want[id]) {
      if (!dot) {
        btn.style.position = 'relative';
        dot = document.createElement('span');
        dot.className = 'note-dot';
        dot.style.cssText = 'position:absolute;top:2px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#EF4444;color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center;';
        btn.appendChild(dot);
      }
      dot.textContent = want[id] > 9 ? '9+' : String(want[id]);
    } else if (dot) {
      dot.remove();
    }
  });
}

function saveNotice() {
  if (!canManage()) return;
  const el = document.getElementById('notice-input');
  const text = (el ? el.value : '').trim();
  pushPatch({ notice: { text, by: (findUser(currentUser)||{}).name || '', at: new Date().toISOString() } });
  _editNotice = false;
  renderAll();
  toast(text ? '한 줄을 걸었습니다' : '한 줄을 내렸습니다');
}
function noticeCard() {
  const nt = state.notice || {};
  const text = (nt.text || '').trim();
  if (!canManage() && !text) return '';

  const label = `<div class="flex items-center gap-2 mb-2">
      <span class="h-px w-5" style="background:rgba(255,255,255,.35)"></span>
      <span class="text-[10px] font-bold tracking-[.22em] text-white/45">목사님 한마디</span>

  '마태복음':'마','마가복음':'막','누가복음':'눅','요한복음':'요','사도행전':'행','로마서':'롬',
  '고린도전서':'고전','고린도후서':'고후','갈라디아서':'갈','에베소서':'엡','빌립보서':'빌','골로새서':'골',
  '데살로니가전서':'살전','데살로니가후서':'살후','디모데전서':'딤전','디모데후서':'딤후','히브리서':'히',
  '야고보서':'약','베드로전서':'벧전','베드로후서':'벧후','요한일서':'요일','요한계시록':'계' };
function qtShortRef(ds) {
  const r = QT_SCHEDULE[ds];
  if (!r) return '';
  const m = r.match(/^([가-힣]+)\s*(.*)$/);
  if (!m) return r;
  return (REF_SHORT[m[1]] || m[1]) + m[2].replace(/\s/g,'');
}
function qtAvailMonths() {
  const out = [];
  let d = parseDate(dateOf(0,0)), end = parseDate(dateOf(WEEKS-1,6));
  d = new Date(d.getFullYear(), d.getMonth(), 1);
  while (d <= end) {
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    d = new Date(d.getFullYear(), d.getMonth()+1, 1);
  }
  return out;
}
function qtShownMonth() {
  const months = qtAvailMonths();
  const want = qtCalMonth || (qtDate || '').slice(0, 7);
  return months.includes(want) ? want : months[0];
}
function shiftQtMonth(step) {
  const months = qtAvailMonths(), i = months.indexOf(qtShownMonth()) + step;
  if (i < 0 || i >= months.length) return;
  qtCalMonth = months[i];
  renderAll();
}

// ==========================================
// 비밀 댓글 — 낸 사람과 목사님, 둘만 보는 칸.
// 제출물과 다른 문서에 담아 화면에서 완전히 갈라 둔다.
// (아이들 화면에는 불러오지도 않는다.)
// ==========================================
function noteKey(kind, id, date) { return `note_${kind}_${id}_${date}`; }
function loadNote(kind, id, date) { loadDocKey(noteKey(kind, id, date)); }
function getNote(kind, id, date) { return _docs[noteKey(kind, id, date)]; }
function noteMsgs(kind, id, date) {
  const d = getNote(kind, id, date);
  return d && Array.isArray(d.msgs) ? d.msgs : [];
}
function canSeeNote(id) { return id === currentUser || canManage(); }
function hasLeaderNote(kind, id, date) { return noteMsgs(kind, id, date).some(m => m.leader); }

// 댓글 한 벌을 통째로 저장한다 — 새 댓글·대댓글·지우기가 모두 이 길로 지난다.
function saveNoteDoc(kind, id, date, msgs, okMsg) {
  const k = noteKey(kind, id, date);
  const doc = { kind:'note', target:kind, studentId:id, date, msgs, updatedAt:new Date().toISOString() };
  _docs[k] = doc;
  renderAll();
  if (!_FS_OK) { toast('저장했어요 (인터넷이 없어 이 기기에만)'); return; }
  _db.collection('discipleDocs').doc(k).set(doc)
    .then(() => { if (okMsg) toast(okMsg); })
    .catch(e => { console.warn('댓글 저장 실패:', e); toast('저장이 안 됐어요. 잠시 뒤 다시 눌러주세요'); });
}
function meAsWriter(text) {
  return { by: currentUser, name: (findUser(currentUser)||{}).name || '',
           leader: isLeader(), text, at: new Date().toISOString() };
}

function addNote(kind, id, date) {
  if (!canSeeNote(id)) return;
  const ta = document.getElementById(`note-${kind}-${id}`);
  const text = (ta ? ta.value : '').trim();
  if (!text) { toast('내용을 적어주세요'); return; }
  if (ta) ta.value = '';
  _replyTo = null;
  saveNoteDoc(kind, id, date, noteMsgs(kind, id, date).concat([meAsWriter(text)]),
              isLeader() ? '피드백을 남겼습니다' : '댓글을 남겼어요');
}

// 대댓글 — 댓글 하나에 매달아 둔다. 오간 이야기가 흩어지지 않도록.
function openReply(kind, id, date, idx) { _replyTo = `${kind}|${id}|${date}|${idx}`; renderAll(); }
function cancelReply() { _replyTo = null; renderAll(); }
function addReply(kind, id, date, idx) {
  if (!canSeeNote(id)) return;
  const ta = document.getElementById(`reply-${kind}-${id}-${idx}`);
  const text = (ta ? ta.value : '').trim();
  if (!text) { toast('내용을 적어주세요'); return; }
  const msgs = noteMsgs(kind, id, date).map((m, k) => k !== idx ? m
    : Object.assign({}, m, { replies: (Array.isArray(m.replies) ? m.replies : []).concat([meAsWriter(text)]) }));
  _replyTo = null;
  saveNoteDoc(kind, id, date, msgs, '답글을 남겼어요');
}
function removeNote(kind, id, date, idx) {
  if (!canManage()) return;
  const msgs = noteMsgs(kind, id, date).slice();
  msgs.splice(idx, 1);
  saveNoteDoc(kind, id, date, msgs, '지웠습니다');
}
function removeReply(kind, id, date, idx, ridx) {
  if (!canManage()) return;
  const msgs = noteMsgs(kind, id, date).map((m, k) => {
    if (k !== idx) return m;
    const rs = (Array.isArray(m.replies) ? m.replies : []).slice();
    rs.splice(ridx, 1);
    return Object.assign({}, m, { replies: rs });
  });
  saveNoteDoc(kind, id, date, msgs, '지웠습니다');
}

// 낸 사람과 목사님에게만 그려 준다. 그 밖의 사람에게는 아예 없는 칸이다.
function noteBlock(kind, id, date) {
  if (!canSeeNote(id)) return '';
  loadNote(kind, id, date);
  const doc = getNote(kind, id, date);
  const msgs = noteMsgs(kind, id, date);
  const who = (findUser(id)||{}).name || '';
  const mine = id === currentUser;
  const when = at => at ? new Date(at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

  const bubble = (m, k, ridx) => {
    const isReply = ridx !== undefined;
    return `<div class="rounded-xl px-3 py-2 ${m.leader ? 'bg-indigo-600' : 'bg-white border'}">
      <p class="text-sm leading-relaxed whitespace-pre-wrap ${m.leader ? 'text-white' : 'text-gray-800'}">${esc(m.text)}</p>
      <div class="flex items-center justify-between mt-1 gap-2">
        <p class="text-[11px] ${m.leader ? 'text-white/60' : 'text-gray-400'} truncate">${esc(m.name)}${m.leader ? ' 목사님' : ''} · ${when(m.at)}</p>
        <div class="flex items-center gap-1 flex-shrink-0">
          ${!isReply ? `<button onclick="openReply('${kind}','${id}','${date}',${k})" style="min-height:24px"
            class="text-[11px] px-1.5 font-semibold ${m.leader ? 'text-white/70' : 'text-indigo-500'}">답글</button>` : ''}
          ${canManage() ? `<button onclick="${isReply ? `removeReply('${kind}','${id}','${date}',${k},${ridx})` : `removeNote('${kind}','${id}','${date}',${k})`}"
            style="min-height:24px" class="text-[11px] px-1 ${m.leader ? 'text-white/60' : 'text-red-400'}">지우기</button>` : ''}
        </div>
      </div>
    </div>`;
  };

  const thread = msgs.map((m, k) => {
    const replies = Array.isArray(m.replies) ? m.replies : [];
    const replying = _replyTo === `${kind}|${id}|${date}|${k}`;
    return `<div class="mb-2">
      ${bubble(m, k)}
      ${replies.length ? `<div class="mt-1.5 ml-4 pl-3 space-y-1.5" style="border-left:2px solid #E0DEF5">
        ${replies.map((r, ri) => bubble(r, k, ri)).join('')}
      </div>` : ''}
      ${replying ? `<div class="mt-1.5 ml-4 pl-3" style="border-left:2px solid #E0DEF5">
        <textarea id="reply-${kind}-${id}-${k}" rows="2" placeholder="${esc(m.name)}에게 답글"
          class="w-full border rounded-xl p-2.5 text-sm resize-none"></textarea>
        <div class="flex gap-2 mt-1.5">
          <button onclick="addReply('${kind}','${id}','${date}',${k})" style="min-height:34px"
            class="flex-1 py-2 rounded-xl font-bold text-xs bg-indigo-600 text-white">답글 남기기</button>
          <button onclick="cancelReply()" style="min-height:34px"
            class="flex-1 py-2 rounded-xl font-bold text-xs bg-gray-100 text-gray-600">취소</button>
        </div>
      </div>` : ''}
    </div>`;
  }).join('');

  return `<div class="mt-3 rounded-xl border border-dashed border-indigo-200 p-3" style="background:#F8F7FF">
    <p class="text-[11px] font-bold text-indigo-700">비밀 댓글 · ${mine ? '나와 목사님만 보입니다' : `${who}와 목사님만 보입니다`}</p>
    ${doc === undefined ? `<p class="text-xs text-gray-400 mt-2">불러오는 중…</p>` : `
      ${msgs.length ? `<div class="mt-2">${thread}</div>`
        : `<p class="text-xs text-gray-400 mt-2">${isLeader() ? '아직 피드백을 달지 않았습니다.' : '아직 목사님 피드백이 없어요.'}</p>`}
      <textarea id="note-${kind}-${id}" rows="2"
        placeholder="${isLeader() ? '피드백을 적어주세요 — 이 아이만 봅니다' : '목사님께 묻고 싶은 것이나 하고 싶은 말'}"
        class="w-full border rounded-xl p-2.5 text-sm resize-none mt-2"></textarea>
      <button onclick="addNote('${kind}','${id}','${date}')" style="min-height:38px"
        class="w-full mt-1.5 py-2 rounded-xl font-bold text-xs ${isLeader() ? 'bg-indigo-600 text-white' : 'bg-white border text-gray-700'}">
        ${isLeader() ? '피드백 남기기' : '댓글 남기기'}
      </button>`}
  </div>`;
}

// ==========================================
// 새 댓글 알림 — 앱을 열었을 때, 그리고 열어 둔 동안 새 댓글이 달리면 알려준다.
// (앱을 꺼 둔 사이에 오는 카톡 같은 알림은 아니다. 앱을 열면 그때 뜬다.)
// ==========================================
let _newNotes = [];          // 아직 안 본 댓글들
let _notesWatching = false;
let _notesFirstSnap = true;

function seenKey() { return 'hwakma_notes_seen_' + (currentUser || ''); }
function lastSeenNotes() {
  try { return localStorage.getItem(seenKey()) || ''; } catch (_) { return ''; }
}
function markNotesSeen() {
  try { localStorage.setItem(seenKey(), new Date().toISOString()); } catch (_) {}
  _newNotes = [];
}
const NOTE_LABEL = { qt:'큐티', dqt:'D형 큐티', sermon:'설교 노트' };

// 문서 하나에서 내가 아직 못 본 남의 글을 모은다(댓글과 대댓글 모두).
function pickNewFrom(v, since) {
  const out = [];
  if (!v || v.kind !== 'note') return out;
  if (!canSeeNote(v.studentId)) return out;
  const target = v.target || 'sermon';
  const push = (m, parent) => {
    if (!m || m.by === currentUser) return;
    if (!m.at || (since && m.at <= since)) return;
    out.push({ target, studentId: v.studentId, date: v.date, name: m.name || '',
               leader: !!m.leader, text: m.text || '', at: m.at, reply: !!parent });
  };
  (v.msgs || []).forEach(m => {
    push(m, null);
    (Array.isArray(m.replies) ? m.replies : []).forEach(r => push(r, m));
  });
  return out;
}

function renderNewNotes() {
  const body = document.getElementById('newnotes-body');
  if (!body) return;
  document.getElementById('newnotes-title').textContent = `새 댓글 ${_newNotes.length}개`;
  body.innerHTML = _newNotes.map(x => {
    const who = (findUser(x.studentId) || {}).name || '';
    return `<div class="rounded-xl border p-3">
      <div class="flex items-center justify-between gap-2">
        <p class="text-xs font-bold text-gray-800 truncate">${esc(x.name)}${x.leader ? ' 목사님' : ''}${x.reply ? ' · 답글' : ''}</p>
        <p class="text-[11px] text-gray-400 flex-shrink-0">${new Date(x.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p>
      </div>
      <p class="text-sm text-gray-700 mt-1 leading-relaxed line-clamp-3">${esc(x.text)}</p>
      <p class="text-[11px] text-gray-400 mt-1.5">${NOTE_LABEL[x.target] || x.target}${canManage() && who ? ` · ${who}` : ''} · ${x.date}</p>
    </div>`;
  }).join('');
}
function showNewNotes() {
  if (!_newNotes.length) return;
  _newNotes.sort((a,b) => a.at < b.at ? 1 : -1);
  renderNewNotes();
  openModal('modal-newnotes');
}
function dismissNewNotes() {
  markNotesSeen();
  closeModal('modal-newnotes');
  renderAll();
}
// 가장 최근 댓글이 달린 곳으로 데려간다.
function goToNewNote() {
  const x = _newNotes[0];
  markNotesSeen();
  closeModal('modal-newnotes');
  if (!x) { renderAll(); return; }
  if (x.target === 'sermon') {
    sermonDate = x.date;
    const sl = slotOf(x.date);
    if (sl) sermonType = sl.i === 5 ? 'fri' : 'sun';
    navigate('sermon');
  } else if (x.target === 'dqt') {
    const sl = slotOf(x.date);
    if (sl) dqtWeek = sl.n;
    navigate('dqt');          // navigate가 D형 탭으로 맞춰 준다
  } else {
    qtDate = x.date;
    qtCalMonth = x.date.slice(0,7);
    navigate('qt');
  }
}

// 앱이 열려 있는 동안에도 새 댓글을 바로 받아 본다.
function watchNotes() {
  if (!_FS_OK || _notesWatching || !currentUser) return;
  _notesWatching = true;
  _notesFirstSnap = true;
  _db.collection('discipleDocs').where('kind','==','note')
    .onSnapshot(snap => {
      const since = lastSeenNotes();
      const fresh = [];
      snap.forEach(d => {
        const v = d.data();
        _docs[d.id] = v;                       // 화면 그릴 때 다시 부르지 않도록 담아 둔다
        pickNewFrom(v, since).forEach(x => fresh.push(x));
      });
      _newNotes = fresh;
      if (_notesFirstSnap) {
        _notesFirstSnap = false;
        if (_newNotes.length) showNewNotes();   // 들어오자마자 한 번
      } else if (_newNotes.length) {
        showNewNotes();                          // 열어 둔 사이에 새로 달리면 그때
      }
      renderAll();
    }, e => { console.warn('댓글 알림 끊김:', e); _notesWatching = false; });
}

// ==========================================
// 제출물 보기 — 종류마다 칸이 다르지만 그리는 방법은 하나로 묶는다.
// ==========================================
const DOC_FIELDS = {
  qt:   [['text','묵상',6]],
  // D형 큐티와 설교 노트는 공책에 손으로 쓰고 사진으로 올린다.
  // 여기 남은 글칸은 사진을 알아보게 돕는 짧은 메모뿐이다.
  dqt:  [['memo','한 줄 메모(안 써도 됩니다)',2]],
  pray: [['verse','오늘 말씀 한 구절',2],['read','이 말씀으로 읽은 내 상황',4],
         ['question','영적으로 생긴 궁금증',3],['feel','느낀점',3],['prayer','기도',3]],
  sermon:[['title','설교 제목',1],['passage','본문',1],['memo','한 줄 메모(안 써도 됩니다)',2]]
};
// 네 단계 색 — 안내 화면에서 쓴다.
const DQT_STYLE = { obs:['step-obs','b-obs','관찰'], int:['step-int','b-int','해석'],
                    feel:['step-feel','b-feel','느낀점'], apply:['step-app','b-app','적용'] };

function docView(kind, doc, id, date) {
  if (!doc) return '';
  // 손으로 쓴 것을 찍어 올리는 둘 — 사진이 먼저다.
  if (kind === 'dqt' || kind === 'sermon') {
    const head = kind === 'sermon' && ((doc.title||'').trim() || (doc.passage||'').trim())
      ? `<p class="text-sm font-bold text-gray-900">${esc(doc.title||'')}
           ${doc.passage ? `<span class="text-xs font-normal text-gray-500 ml-1">${esc(doc.passage)}</span>` : ''}</p>` : '';
    const img = doc.image
      ? `<img src="${doc.image}" onclick="showImg(this.src)" class="w-full rounded-xl border mt-1 cursor-pointer" style="max-height:420px;object-fit:contain;background:#F9FAFB">`
      : '';
    const memo = (doc.memo||'').trim()
      ? `<p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap bg-gray-50 rounded-xl p-3 mt-2">${esc(doc.memo)}</p>` : '';
    const apply = kind === 'dqt' && (id === currentUser || canManage())
      ? `<button onclick="toggleApplyDone('${id}','${date}')" style="min-height:38px"
           class="w-full mt-2 py-2 rounded-xl text-xs font-bold ${doc.applyDone?'bg-green-100 text-green-700':'bg-white border border-gray-300 text-gray-600'}">
           ${doc.applyDone ? '✓ 어제 적은 적용을 지켰습니다' : '적용을 지켰으면 눌러주세요'}</button>`
      : (kind === 'dqt' && doc.applyDone ? `<p class="text-xs text-green-700 font-bold mt-2">✓ 적용을 지켰습니다</p>` : '');
    return head + img + memo + apply + noteBlock(kind, id, date);
  }
  const rows = DOC_FIELDS[kind].map(([f,lab]) => {
    if (!(doc[f]||'').trim()) return '';
    return `<div class="mb-2">
      <p class="text-[11px] text-gray-400 font-semibold mb-0.5">${lab}</p>
      <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap bg-gray-50 rounded-xl p-3">${esc(doc[f])}</p>
    </div>`;
  }).join('');
  const mins = kind === 'pray' && doc.minutes ? `<p class="text-[11px] text-gray-400 mb-1">🕯️ ${esc(doc.minutes)}분 기도했어요</p>` : '';
  const img = doc.image ? `<img src="${doc.image}" onclick="showImg(this.src)" class="w-full rounded-xl border mt-2 cursor-pointer" style="max-height:320px;object-fit:contain;background:#F9FAFB">` : '';
  // 큐티에도 비밀 댓글을 붙인다 — 낸 사람과 목사님만 본다.
  return mins + rows + img + (kind === 'qt' ? noteBlock('qt', id, date) : '');
}

// 인도자가 고치는 칸
function docEditForm(kind, id, date) {
  const doc = getDoc(kind, id, date) || {};   // 인도자가 아이 글을 바로잡을 때만 쓴다
  return DOC_FIELDS[kind].map(([f,lab,rows]) => `
    <p class="text-[11px] text-gray-500 font-semibold mt-2 mb-0.5">${lab}</p>
    <textarea id="ed-${kind}-${id}-${f}" rows="${rows}" class="w-full border rounded-xl p-2.5 text-sm resize-none">${esc(doc[f]||'')}</textarea>`).join('')
    + `<div class="flex gap-2 mt-2">
        <button onclick="saveEditDoc('${kind}','${id}','${date}')" class="flex-1 bg-gray-900 text-white py-2.5 rounded-xl font-bold text-sm">저장</button>
        <button onclick="_editingDoc=null;renderAll()" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold text-sm">취소</button>
      </div>`;
}
function saveEditDoc(kind, id, date) {
  if (!canManage()) return;
  const prev = getDoc(kind, id, date) || {};
  const data = Object.assign({}, prev);
  DOC_FIELDS[kind].forEach(([f]) => {
    const el = document.getElementById(`ed-${kind}-${id}-${f}`);
    if (el) data[f] = el.value.trim();
  });
  data.editedBy = (findUser(currentUser)||{}).name || '';
  _editingDoc = null;
  saveDoc(kind, id, date, data, '고쳤습니다');
}

// 손으로 쓴 것이 올라오는 피드. 낸 사람은 펼쳐서, 안 낸 사람은 아래에 이름만.
function photoFeed(kind, date, heading, note) {
  const people = state.students.concat(LEADERS.filter(l => l.id === MANAGER && l.id !== currentUser));
  people.forEach(s => loadDoc(kind, s.id, date));
  if (canManage()) people.forEach(s => loadNote(kind, s.id, date));

  const done = [], waiting = [];
  people.forEach(s => {
    const raw = getDoc(kind, s.id, date);
    if (raw === undefined) { waiting.push({ s, loading:true }); return; }
    (hasContent(kind, raw) ? done : waiting).push({ s, doc: raw });
  });
  done.sort((a,b) => String(a.doc.updatedAt||'').localeCompare(String(b.doc.updatedAt||'')));

  const needFeedback = canManage()
    ? done.filter(x => !hasLeaderNote(kind, x.s.id, date)).map(x => x.s.name) : [];
  const yet = waiting.filter(x => !x.loading);

  // 한 사람씩 한 줄로 접어 둔다. 누른 사람 것만 펼쳐 보여준다 —
  // 열한 명 사진을 다 펼쳐 두면 화면이 너무 길어져 확인이 힘들다.
  const rows = done.map(({ s, doc }) => {
    const me = s.id === currentUser;
    const open = openPerson[kind] === s.id;
    const editing = _editingDoc === kind + '_' + s.id;
    const noFb = canManage() && !hasLeaderNote(kind, s.id, date);
    const cnt = noteMsgs(kind, s.id, date).length;
    const when = doc.updatedAt ? new Date(doc.updatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    return `<div class="border-b last:border-0">
      <div onclick="openPerson['${kind}'] = openPerson['${kind}']==='${s.id}' ? null : '${s.id}'; _editingDoc=null; _delArm=null; _replyTo=null; renderAll()"
           class="flex items-center gap-2.5 py-2 cursor-pointer">
        ${doc.image ? `<img src="${doc.image}" class="w-11 h-11 rounded-lg object-cover border flex-shrink-0" style="background:#F9FAFB">`
                    : `<div class="w-11 h-11 rounded-lg border flex-shrink-0 bg-gray-50"></div>`}
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <span class="text-sm font-bold text-gray-900 truncate">${s.name}${me?' <span class="text-[11px] font-normal text-gray-400">(나)</span>':''}</span>
            ${s.role ? `<span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold bg-gray-100 text-gray-500 flex-shrink-0">${s.role}</span>` : ''}
            ${doc.late ? '<span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold bg-amber-100 text-amber-700 flex-shrink-0">늦음</span>' : ''}
            ${noFb ? '<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-red-100 text-red-600 font-bold flex-shrink-0">피드백 필요</span>' : ''}
          </div>
          <p class="text-[11px] text-gray-400 mt-0.5 truncate">${when}${cnt ? ` · 댓글 ${cnt}` : ''}${(doc.title||'').trim() ? ` · ${esc(doc.title)}` : ''}</p>
        </div>
        <span class="text-gray-300 text-xs flex-shrink-0">${open?'▲':'▼'}</span>
      </div>
      ${open ? `<div class="pb-3">
        ${editing ? docEditForm(kind, s.id, date) : docView(kind, doc, s.id, date)}
        ${!editing && canManage() ? (_delArm === kind + '_' + s.id ? `
          <div class="flex items-center gap-2 mt-2">
            <span class="text-xs text-red-600 font-semibold flex-1">${s.name} ${KINDS[kind].label}을 지울까요?</span>
            <button onclick="doDelete('${kind}','${s.id}','${date}')" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-bold bg-red-600 text-white">지웁니다</button>
            <button onclick="cancelDelete()" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-semibold bg-gray-100 text-gray-600">그만</button>
          </div>` : `
          <div class="flex gap-2 mt-2">
            <button onclick="_editingDoc='${kind}_${s.id}';_delArm=null;renderAll()" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-semibold bg-white border text-gray-600">메모 고치기</button>
            <button onclick="armDelete('${kind}','${s.id}')" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-semibold bg-white border text-red-500">지우기</button>
          </div>`) : ''}
        ${doc.editedBy ? `<p class="text-[11px] text-gray-400 mt-1">${esc(doc.editedBy)} 목사님이 손댄 기록이 있어요</p>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');

  return `
    ${!isLeader() ? '' : waiting.length ? `<div class="card !py-3 ${yet.length?'border border-amber-200 bg-amber-50':''}">
      <div class="flex items-center justify-between mb-1.5">
        <p class="text-xs font-bold ${yet.length?'text-amber-800':'text-gray-400'}">아직 안 낸 사람</p>
        <span class="text-xs font-bold ${yet.length?'text-amber-700':'text-gray-300'}">${yet.length}명</span>
      </div>
      <div class="flex flex-wrap gap-1">
        ${waiting.map(({s, loading}) => `<span class="text-xs px-2.5 py-1 rounded-full font-bold ${loading?'bg-gray-50 text-gray-300':'bg-white text-amber-800 border border-amber-200'}">${s.name}</span>`).join('')}
      </div>
    </div>` : `<div class="card !py-2.5 bg-green-50 border border-green-200 text-center">
      <p class="text-xs font-bold text-green-700">전원 다 냈습니다</p>
    </div>`}
    <div class="card !py-3">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-gray-800 text-sm">${heading}</h3>
        <span class="text-xs font-bold ${done.length?'text-blue-600':'text-gray-300'}">${done.length}명 올림</span>
      </div>
      ${note ? `<p class="text-[11px] text-gray-400 mt-0.5">${note}</p>` : ''}
      ${needFeedback.length ? `<p class="text-[11px] text-red-600 font-semibold mt-1.5">피드백 없음 — ${needFeedback.join(' · ')}</p>` : ''}
      ${rows ? `<div class="mt-1">${rows}</div>`
             : `<p class="text-sm text-gray-400 text-center py-6">아직 올라온 것이 없어요</p>`}
      ${rows ? `<p class="text-[11px] text-gray-400 mt-2 text-center">이름을 누르면 사진과 댓글이 펼쳐집니다</p>` : ''}
    </div>`;
}

// 그날 반 전체가 낸 것 — 서로 보고 배우라고 열어 둔다(기도 영적일지만 빼고).
// D형 큐티와 설교 노트는 손으로 쓴 사진이라 접지 않고 피드처럼 펼쳐 보여준다.
function peopleList(kind, date, heading, note) {
  const feed = (kind === 'dqt' || kind === 'sermon');
  if (feed) return photoFeed(kind, date, heading, note);
  let people = state.students.concat(LEADERS.filter(l => l.id === MANAGER));
  people.forEach(x => loadDoc(kind, x.id, date));
  // 목사님 화면에서는 아직 안 낸 아이를 위로 올린다 — 누가 빠졌는지 빨리 보이도록.
  if (isLeader()) {
    people = people.slice().sort((a, b) => {
      const A = submitted(kind, a.id, date) ? 1 : 0, B = submitted(kind, b.id, date) ? 1 : 0;
      return A - B;
    });
  }
  const rows = people.map(s => {
    loadDoc(kind, s.id, date);
    const raw = getDoc(kind, s.id, date);
    const doc = raw === undefined ? undefined : (hasContent(kind, raw) ? raw : null);
    const open = openPerson[kind] === s.id;
    const me = s.id === currentUser;
    const editing = _editingDoc === kind + '_' + s.id;
    return `<div class="border-b last:border-0">
      <div onclick="openPerson['${kind}'] = openPerson['${kind}']==='${s.id}' ? null : '${s.id}'; _editingDoc=null; renderAll()"
           class="flex items-center justify-between py-2 cursor-pointer">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-sm text-gray-800 font-semibold truncate">${s.name}${me?' <span class="text-xs text-gray-400">(나)</span>':''}</span>
          ${s.role ? `<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500 font-semibold">${s.role}</span>` : ''}
          ${s.title ? `<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500 font-semibold">${s.title.split(' / ').pop()}</span>` : ''}
          ${doc === undefined ? '<span class="text-[11px] text-gray-300">…</span>'
            : (doc ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-semibold">올림${doc.late?' · 늦음':''}</span>`
                   : '<span class="text-[11px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-400">아직</span>')}
        </div>
        <span class="text-gray-300 text-xs">${open?'▲':'▼'}</span>
      </div>
      ${open ? (doc ? `<div class="pb-3">
        ${editing ? docEditForm(kind, s.id, date) : docView(kind, doc, s.id, date)}
        ${!editing && canManage() ? (_delArm === kind + '_' + s.id ? `
          <div class="flex items-center gap-2 mt-2">
            <span class="text-xs text-red-600 font-semibold flex-1">${s.name} ${KINDS[kind].label}을 지울까요?</span>
            <button onclick="doDelete('${kind}','${s.id}','${date}')" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-bold bg-red-600 text-white">지웁니다</button>
            <button onclick="cancelDelete()" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-semibold bg-gray-100 text-gray-600">그만</button>
          </div>` : `
          <div class="flex gap-2 mt-2">
            <button onclick="_editingDoc='${kind}_${s.id}';_delArm=null;renderAll()" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-semibold bg-white border text-gray-600">고치기</button>
            <button onclick="armDelete('${kind}','${s.id}')" style="min-height:32px" class="text-xs px-3 py-1.5 rounded-full font-semibold bg-white border text-red-500">지우기</button>
          </div>`) : ''}
        ${doc.editedBy ? `<p class="text-[11px] text-gray-400 mt-1">${esc(doc.editedBy)} 목사님이 손댄 기록이 있어요</p>` : ''}
      </div>` : `<p class="text-xs text-gray-400 pb-3">아직 올리지 않았어요</p>`) : ''}
    </div>`;
  }).join('');
  return `<div class="card">
    <h3 class="font-bold text-gray-800 text-sm mb-1">${heading}</h3>
    ${note ? `<p class="text-[11px] text-gray-400 mb-2">${note}</p>` : ''}
    ${rows}
  </div>`;
}

// 사진 올리는 칸 (큐티·설교 노트)
function imageBox(kind, date, saved) {
  const shown = _pendingImg || (saved && saved.image) || '';
  return `${shown ? `
    <div class="mt-3 relative">
      <img src="${shown}" onclick="showImg(this.src)" class="w-full rounded-xl border cursor-pointer" style="max-height:320px;object-fit:contain;background:#F9FAFB">
      <div class="absolute top-2 right-2 flex gap-1.5">
        <button onclick="rotateImage('${kind}','${date}')" style="min-height:32px" class="bg-black/60 text-white text-xs px-3 py-1 rounded-full">↻ 돌리기</button>
        <button onclick="clearImage()" style="min-height:32px" class="bg-black/60 text-white text-xs px-3 py-1 rounded-full">사진 빼기</button>
      </div>
      ${_pendingImg ? `<p class="text-[11px] text-amber-600 mt-1">아직 안 올렸어요 — 아래 버튼을 눌러야 저장됩니다</p>` : ''}
    </div>` : ''}
    <label class="mt-3 flex items-center justify-center gap-2 border-2 border-dashed border-gray-300 rounded-xl py-3 text-sm font-semibold text-gray-500 cursor-pointer active:bg-gray-50">
      📷 ${shown ? '사진 바꾸기' : '노트 사진 올리기'}
      <input type="file" accept="image/*" class="hidden" onchange="pickImage(this)">
    </label>`;
}

function renderDailyQT() {
  const el = document.getElementById('qt-daily');
  if (!slotOf(qtDate)) qtDate = dateOf(currentWeek(), 0);
  const { n, i } = slotOf(qtDate);
  const d = parseDate(qtDate);
  const ref = QT_SCHEDULE[qtDate] || '';
  const me = currentUser;

  // ── 달력 (일~토 7열 월간) ──
  const month = qtShownMonth();
  const [my, mm] = month.split('-').map(Number);
  const months = qtAvailMonths(), mi = months.indexOf(month);
  const first = new Date(my, mm - 1, 1), last = new Date(my, mm, 0);
  const todayStr = iso(today0());
  const rows = [];
  let cur = addDays(first, -first.getDay());
  while (cur <= last) {
    const cells = [];
    for (let k = 0; k < 7; k++) {
      const c = addDays(cur, k), ds = iso(c);
      if (c.getMonth() + 1 !== mm) { cells.push('<div class="flex-1 min-w-0"></div>'); continue; }
      const slot = slotOf(ds);
      const mine = slot && !isLeader() ? qtOf(me, slot.n)[slot.i] : false;
      const cnt  = slot ? state.students.filter(x => qtOf(x.id, slot.n)[slot.i]).length : 0;
      const sel = ds === qtDate, isToday = ds === todayStr;
      // 주일은 붉게, 토요일은 푸르게. 한 주가 주일에 열려 토요일 모임으로 닫히는 것이
      // 달력에서도 그대로 보이게 한다.
      const dow = c.getDay(), isSun = dow === 0, isSat = dow === 6;
      const bg = !slot ? (isSun ? 'bg-red-50' : isSat ? 'bg-blue-50' : 'bg-gray-50')
               : mine ? 'bg-green-100'
               : isSun ? 'bg-red-50 border border-red-100'
               : isSat ? 'bg-blue-50 border border-blue-100'
               : 'bg-white border';
      // 오늘은 색이 아니라 테두리로 짚는다 — 주말 색과 부딪히지 않도록.
      const ring = sel ? 'ring-2 ring-gray-900' : (isToday && slot ? 'ring-2 ring-gray-400' : '');
      const numC = !slot ? (isSun ? 'text-red-200' : isSat ? 'text-blue-200' : 'text-gray-300')
                 : mine ? 'text-green-700'
                 : isSun ? 'text-red-600' : isSat ? 'text-blue-600' : 'text-gray-700';
      const refC = mine ? 'text-green-500' : isSun ? 'text-red-300' : isSat ? 'text-blue-300' : 'text-gray-400';
      cells.push(`<div class="flex-1 min-w-0 rounded-lg py-1 px-0.5 text-center ${bg} ${ring} ${slot?'cursor-pointer active:scale-95':''} transition-all"
        ${slot ? `onclick="setDate('qt','${ds}')"` : ''}>
        <p class="text-[11px] font-bold ${numC}">${c.getDate()}</p>
        <p class="text-[8px] leading-tight ${refC} truncate">${qtShortRef(ds)}</p>
        ${slot ? (!isLeader()
            ? `<p class="text-[9px] ${mine?'text-green-600':'text-transparent'}">✓</p>`
            : `<p class="text-[9px] ${cnt?'text-blue-600 font-bold':'text-transparent'}">${cnt||0}</p>`)
          : '<p class="text-[9px]">&nbsp;</p>'}
      </div>`);
    }
    rows.push(`<div class="flex gap-0.5 mb-1">${cells.join('')}</div>`);
    cur = addDays(cur, 7);
  }
  const calendar = `
    <div class="card !py-3">
      <div class="flex items-center justify-between mb-2">
        <button onclick="shiftQtMonth(-1)" style="min-height:32px" class="px-2 text-xl ${mi<=0?'text-gray-200':'text-gray-400'}">‹</button>
        <p class="text-sm font-bold text-gray-900">${my}년 ${mm}월</p>
        <button onclick="shiftQtMonth(1)" style="min-height:32px" class="px-2 text-xl ${mi>=months.length-1?'text-gray-200':'text-gray-400'}">›</button>
      </div>
      <div class="flex gap-0.5 mb-1">
        ${['일','월','화','수','목','금','토'].map((w,k) =>
          `<div class="flex-1 text-center text-[10px] font-bold ${k===0?'text-red-500':k===6?'text-blue-500':'text-gray-400'}">${w}</div>`).join('')}
      </div>
      ${rows.join('')}
      <p class="text-[11px] text-gray-400 mt-1 text-center">
        날짜를 누르면 그날 큐티로 갑니다 · ${!isLeader() ? '초록칸은 내가 올린 날' : '숫자는 그날 올린 사람 수'}
      </p>
    </div>`;

  loadDoc('qt', me, qtDate);
  const saved = getDoc('qt', me, qtDate);
  const loading = saved === undefined;
  const open = canWrite(qtDate);

  const material = `
    <div class="card !py-3">
      <h3 class="font-bold text-gray-800 text-sm mb-2">9·10월 큐티 자료</h3>
      <div class="flex gap-2">
        ${Object.keys(QT_PDF).map(ym => `
          <a href="./files/${ym}/youth-qt-${ym}.pdf" target="_blank" rel="noopener"
             class="flex-1 text-center bg-gray-50 border rounded-xl py-2.5 text-sm font-semibold text-gray-700">
            ${QT_PDF[ym]} 매일성경</a>`).join('')}
      </div>
      <p class="text-[11px] text-gray-400 mt-1.5">성서유니온 청소년 매일성경 월별 PDF입니다.</p>
    </div>`;

  el.innerHTML = `
    ${material}
    ${calendar}
    <div class="card !py-3 text-center">
      <p class="text-xs text-gray-500">${n+1}주차 · ${dayLabel(qtDate)}</p>
      <p class="text-base font-bold text-gray-900 mt-0.5">${esc(ref || '본문이 없는 날')}</p>
    </div>

    <div class="card !p-3">
      <div class="flex gap-2">
        ${[0,1].map(s => `
          <div class="su-img flex-1">
            <img src="${suYouthImgUrl(qtDate, s)}" onclick="showImg(this.src)"
                 onerror="this.closest('.su-img').style.display='none'"
                 class="w-full rounded-lg border cursor-pointer active:opacity-80" style="display:block">
          </div>`).join('')}
      </div>
      <p class="text-[11px] text-gray-400 mt-2 text-center">사진을 누르면 크게 볼 수 있어요 · 성서유니온 「청소년 매일성경」</p>
    </div>

    <div class="card">
      <div class="flex items-center justify-between mb-2"><h3 class="font-bold text-gray-800 text-sm">${dayLabel(qtDate)} 내 묵상</h3><span data-draft-status class="text-[10px] text-gray-400">입력 자동 저장</span></div>
      ${loading ? `<p class="text-sm text-gray-400 py-6 text-center">불러오는 중…</p>`
      : !open ? `
        ${hasContent('qt', saved) ? `${docView('qt', saved, me, qtDate)}
          <p class="text-[11px] text-gray-400 mt-2 text-center">🔒 지난 날이라 고칠 수 없어요</p>`
          : lockNote(qtDate, '큐티')}`
      : `
      <textarea id="qt-text" rows="6" oninput="dset('qt','${qtDate}','text',this.value)"
        placeholder="오늘 말씀을 읽고 마음에 남은 것, 하나님이 어떤 분으로 보였는지 자유롭게 적어보세요. 더 깊이 파고들 때는 D형 큐티를 씁니다."
        class="w-full border rounded-xl p-3 text-sm resize-none">${esc(dv('qt', qtDate, 'text', saved && saved.text))}</textarea>
      ${imageBox('qt', qtDate, saved)}
      <button onclick="submitQt('${qtDate}')"
        class="w-full mt-3 py-4 rounded-xl font-bold text-sm ${hasContent('qt',saved) ? 'bg-blue-600 text-white' : 'bg-gray-900 text-white'}">
        ${hasContent('qt',saved) ? '고쳐서 다시 올리기' : '큐티 올리기'}
      </button>
      ${lockNote(qtDate, '큐티')}
      ${saved && saved.updatedAt ? `<p class="text-[11px] text-gray-400 mt-2 text-center">${new Date(saved.updatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}에 올렸어요</p>` : ''}
      ${hasContent('qt', saved) ? noteBlock('qt', me, qtDate) : ''}
      `}
    </div>

    <div class="card !py-3 text-center">
      <p class="text-sm ${cntOf('qt',me,n)>=4?'text-green-700 font-bold':'text-gray-600'}">이번 주 큐티 ${cntOf('qt',me,n)}일 / 7일 · ${cntOf('qt',me,n)>=4?'통과':'4일 이상 해야 통과'}</p>
    </div>

    ${peopleList('qt', qtDate, `${dayLabel(qtDate)} 친구들 큐티`, '이름을 누르면 그날 올린 묵상을 볼 수 있어요')}
`;
}

function setQtSection(section) {
  qtSection = section === 'dqt' ? 'dqt' : 'daily';
  _editingDoc = null; _delArm = null; _pendingImg = null;
  window.scrollTo(0, 0);
  renderQT();
}

function renderQT() {
  const daily = document.getElementById('qt-daily');
  const dqt = document.getElementById('page-dqt');
  document.getElementById('qt-tabs').innerHTML = `
    <div class="grid grid-cols-2 gap-1 rounded-xl bg-gray-200 p-1">
      <button onclick="setQtSection('daily')" class="rounded-lg py-2.5 text-sm font-bold ${qtSection==='daily'?'bg-white text-gray-900 shadow-sm':'text-gray-500'}">매일 큐티</button>
      <button onclick="setQtSection('dqt')" class="rounded-lg py-2.5 text-sm font-bold ${qtSection==='dqt'?'bg-white text-gray-900 shadow-sm':'text-gray-500'}">D형 큐티</button>
    </div>`;
  daily.classList.toggle('hidden', qtSection !== 'daily');
  dqt.classList.toggle('hidden', qtSection !== 'dqt');
  if (qtSection === 'dqt') renderDQT(); else renderDailyQT();
}

const DQT_HELP = {
  obs: ['관찰', '본문에 <b>있는 것</b>만 적습니다. 내 생각은 아직 넣지 않습니다.',
        ['누가 · 언제 · 어디서 · 무엇을 · 어떻게 — 사실을 그대로 찾습니다',
         '찾은 사실을 <b>내 말로 바꿔 적습니다</b>(페러프레이징). 그대로 베끼지 않습니다',

  int: ['해석', '관찰한 것에 <b>질문</b>을 겁니다 — 왜? 어떻게? 무엇을?',
        ['왜 이 말이 여기 있을까? 왜 하필 이렇게 하셨을까?',

function helpBlock(f) {
  const [lab, lead, items] = DQT_HELP[f];

// D형 큐티는 주 1회다. 문서도 그 주 주일 날짜 하나로 묶어 둔다.
function dqtDocDate(n) { return dateOf(n, 0); }
function canWriteDqt(n) { return canManage() || (weekStarted(n) && !weekEnded(n)); }

function renderDQT() {
  const el = document.getElementById('page-dqt');
  if (dqtWeek < 0 || dqtWeek >= WEEKS) dqtWeek = currentWeek();
  const n = dqtWeek, wi = weekInfo(n), me = currentUser;
  const dd = dqtDocDate(n);
  loadDoc('dqt', me, dd);
  const saved = getDoc('dqt', me, dd);
  const loading = saved === undefined;
  const open = canWriteDqt(n);

  const tabs = `<div class="scroll-table -mx-1 px-1"><div class="flex gap-1.5 pb-1">

      class="px-3 py-2 rounded-xl text-xs font-bold flex-shrink-0 ${k===n?'bg-gray-900 text-white':(dqtDone(me,k)?'bg-green-100 text-green-700':'bg-white text-gray-600 border')}">

  // 그 주에 읽는 본문 — 어느 날 것으로 D형을 써도 좋다.

  // 지난 주에 적은 적용을 이번 주에 지켰는지 — 적어만 두고 흘려보내지 않도록.
  let checkup = '';
  if (n > 0) {
    const pd = dqtDocDate(n-1);

    const y = getDoc('dqt', me, pd);

        <button onclick="toggleApplyDone('${me}','${pd}')"

  // 쓰는 법 — 공책을 펴 놓고 이걸 보면서 쓴다. 그래서 접지 않고 늘 펼쳐 둔다.

      ${['obs','int','feel','apply'].map(f => {
        const [lab, lead, items] = DQT_HELP[f];
        const [bd, bg] = DQT_STYLE[f];
        return `<div class="${bd} bg-gray-50 rounded-r-xl px-3 py-2.5 mb-2">
          <span class="step-badge ${bg}">${lab}</span>
          <p class="text-xs text-gray-800 leading-relaxed mt-1 font-semibold">${lead}</p>

  const form = `
    <div class="card">
      <div class="flex items-center justify-between mb-1"><h3 class="font-bold text-gray-800 text-sm">${n+1}주차 내 D형 큐티</h3><span data-draft-status class="text-[10px] text-gray-400">메모 자동 저장</span></div>
      <p class="text-[11px] text-gray-400 mb-1">한 주에 <b>한 번</b>이면 됩니다 · ${fmt(wi.sun)}(일) ~ ${fmt(wi.sat)}(토) 안에 올려주세요</p>
      ${loading ? `<p class="text-sm text-gray-400 py-6 text-center">불러오는 중…</p>`
      : !open ? `
        ${hasContent('dqt', saved) ? `${docView('dqt', saved, me, dd)}
          <p class="text-[11px] text-gray-400 mt-2 text-center">🔒 지난 주라 새로 올릴 수 없어요</p>`
          : `<div class="text-center py-6">
              <p class="text-2xl">🔒</p>
              <p class="text-sm text-gray-500 mt-1 font-semibold">${weekStarted(n) ? '이 주는 닫혔어요' : '아직 오지 않은 주예요'}</p>
              <p class="text-xs text-gray-400 mt-1">D형 큐티는 <b>그 주 안에</b> 올려야 합니다.</p>
              <button onclick="dqtWeek=${currentWeek()};renderAll()" class="mt-3 px-4 py-2.5 rounded-xl bg-gray-900 text-white font-bold text-sm">이번 주로 가기</button>
            </div>`}`
      : `
      ${shown ? `
      <div class="relative mt-1">
        <img src="${shown}" onclick="showImg(this.src)" class="w-full rounded-xl border cursor-pointer" style="max-height:420px;object-fit:contain;background:#F9FAFB">
        <div class="absolute top-2 right-2 flex gap-1.5">
          <button onclick="rotateImage('dqt','${dd}')" style="min-height:32px" class="bg-black/60 text-white text-xs px-3 py-1 rounded-full">↻ 돌리기</button>
          <button onclick="clearImage()" style="min-height:32px" class="bg-black/60 text-white text-xs px-3 py-1 rounded-full">사진 빼기</button>

        ${_pendingImg ? `<p class="text-[11px] text-amber-600 mt-1">아직 안 올렸어요 — 아래 버튼을 눌러야 저장됩니다</p>` : ''}
      </div>` : ''}
      <label class="mt-3 flex flex-col items-center justify-center gap-1 border-2 border-dashed border-gray-300 rounded-xl py-6 cursor-pointer active:bg-gray-50">
        <span class="text-2xl">📷</span>
        <span class="text-sm font-bold text-gray-700">${shown ? '사진 바꾸기' : '공책 사진 올리기'}</span>
        <span class="text-[11px] text-gray-400">두 면이면 나란히 놓고 한 장으로 찍어주세요</span>
        <input type="file" accept="image/*" class="hidden" onchange="pickImage(this)">
      </label>
      <textarea id="dqt-memo" rows="2" oninput="dset('dqt','${dd}','memo',this.value)"

        class="w-full border rounded-xl p-3 text-sm resize-none mt-3">${esc(dv('dqt', dd, 'memo', saved && saved.memo))}</textarea>
      <button onclick="submitDqt('${dd}')"
        class="w-full mt-3 py-4 rounded-xl font-bold text-sm ${hasContent('dqt',saved) ? 'bg-blue-600 text-white' : 'bg-gray-900 text-white'}">

      </button>
      ${saved && saved.updatedAt ? `<p class="text-[11px] text-gray-400 mt-2 text-center">${new Date(saved.updatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}에 올렸어요</p>` : ''}
      ${hasContent('dqt', saved) ? noteBlock('dqt', me, dd) : ''}`}
    </div>`;

  el.innerHTML = tabs + `
    <div class="card !py-3 text-center ${dqtDone(me,n)?'bg-green-50 border border-green-200':''}">
      <p class="text-sm font-bold ${dqtDone(me,n)?'text-green-700':'text-gray-500'}">D형 큐티 · ${dqtDone(me,n)?'통과':'제출해야 통과'}</p>
    </div>
    ${checkup}
    <div class="card !py-3">
      <p class="text-xs text-gray-500 text-center">${n+1}주차 · ${fmt(wi.sun)}(일) ~ ${fmt(wi.sat)}(토)</p>
      <p class="text-[11px] text-gray-400 text-center mt-0.5 mb-2">이 주에 읽는 본문 가운데 <b>하나</b>를 골라 D형으로 씁니다</p>

    ${guide}
    ${peopleList('dqt', dd, `${n+1}주차 반 전체 D형 큐티`, '손으로 쓴 것을 서로 보고 배웁니다 · 비밀 댓글은 본인과 목사님만 봅니다')}`;

const PRAY_RULES = [
  ['하나님 앞에 멈춥니다', '매일 <b>10~15분</b>, 하던 일을 멈추고 하나님께 마음을 향합니다. 기록보다 하나님 앞에 머무는 것이 먼저입니다.'],
  ['소리 내어 기도합니다', '중요한 것은 읊조리듯이라도 소리를 내어 기도하는 통성기도 습관을 기르는 것입니다.'],
  ['기도제목을 찾습니다', '말씀에서 나오는 하나님을 찬양하고, 회개하고, 감사하고, 중보해야 할 기도제목을 찾습니다.'],
  ['궁금증을 덮지 않습니다', '이해가 안 되는 것과 하나님께 묻고 싶은 것을 그대로 가져갑니다. 좋은 질문이 신앙을 자라게 합니다.'],
  ['잠잠히 듣습니다', '기도를 서둘러 끝내지 않고 잠시 머물며 하나님이 깨닫게 하시는 것을 살핍니다.'],
  ['짧게 남깁니다', '기도를 마친 뒤 기억해야 할 말씀과 기도제목만 간단히 적습니다. 기록은 기도를 돕기 위한 것입니다.']
];
const _timer = { left:0, total:0, id:null, spent:0 };
function fmtMS(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function paintTimer() {
  const el = document.getElementById('timer-display');
  if (!el) return;
  el.textContent = fmtMS(_timer.left);
  const bar = document.getElementById('timer-bar');
  if (bar && _timer.total) bar.style.width = (100 - _timer.left / _timer.total * 100) + '%';
}
function startTimer(min) {
  clearInterval(_timer.id);
  _timer.total = min * 60; _timer.left = min * 60;
  paintTimer();
  _timer.id = setInterval(() => {
    _timer.left--;
    if (_timer.left <= 0) {
      clearInterval(_timer.id); _timer.id = null; _timer.left = 0;
      _timer.spent = min;
      const mi = document.getElementById('pray-minutes');
      if (mi && !mi.value) mi.value = String(min);
      paintTimer();
      renderAll();
      toast(`${min}분이 지났어요. 이제 적어봅시다`, 4000);
      return;
    }
    paintTimer();
  }, 1000);
  renderAll();
}
function stopTimer() {
  if (_timer.id) {
    clearInterval(_timer.id); _timer.id = null;
    _timer.spent = Math.max(1, Math.round((_timer.total - _timer.left) / 60));
    const mi = document.getElementById('pray-minutes');
    if (mi && !mi.value) mi.value = String(_timer.spent);
  }
  renderAll();
}

    <div class="card bg-gray-50 border border-gray-200">
      <p class="text-xs text-gray-700 leading-relaxed">기도 영적일지는 <b>친구들에게 보이지 않습니다.</b>

  el.innerHTML = `

      <p class="text-[11px] text-gray-400 mt-0.5">말씀을 가지고 내 상황을 해석하는 시간입니다</p>
      ${loading ? `<p class="text-sm text-gray-400 py-6 text-center">불러오는 중…</p>`
      : !open ? `
        ${hasContent('pray', saved) ? `<div class="mt-3">${docView('pray', saved, me, prayDate)}</div>
          <p class="text-[11px] text-gray-400 mt-2 text-center">🔒 지난 날이라 고칠 수 없어요</p>`

      ${saved && saved.updatedAt ? `<p class="text-[11px] text-gray-400 mt-2 text-center">${new Date(saved.updatedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}에 올렸어요</p>` : ''}`}
    </div>
    <div class="card !py-3 text-center">
      <p class="text-sm ${cntOf('pray',me,n)>=4?'text-green-700 font-bold':'text-gray-600'}">이번 주 기도일지 ${cntOf('pray',me,n)}일 / 7일 · ${cntOf('pray',me,n)>=4?'통과':'4일 이상 해야 통과'}</p>
    </div>
    ${leaderView}`;
}

// ==========================================

// ==========================================
function setSermonType(type) {
  const s = slotOf(sermonDate);

  sermonDate = dateOf(s ? s.n : currentWeek(), sermonType === 'fri' ? 5 : 0);
  _pendingImg = null; _editingDoc = null; _delArm = null;
  renderAll();
}

    </div>
    ${isLeader() ? '' : `<div class="card">
      <div class="flex items-center justify-between mb-1"><h3 class="font-bold text-gray-800 text-sm">내 설교 노트</h3><span data-draft-status class="text-[10px] text-gray-400">입력 자동 저장</span></div>
      ${loading ? `<p class="text-sm text-gray-400 py-6 text-center">불러오는 중…</p>`

// ==========================================
// 생일 — 생년월일·연락처는 코드에 없다. 서버(state.profiles)에서 받아 온다.
// ==========================================
function profileOf(id) { return (state.profiles || {})[id] || {}; }
function birthOf(id)   { return profileOf(id).birth || ''; }   // 'YYYY-MM-DD'
function phoneOf(id)   { return profileOf(id).phone || ''; }
function birthLabel(id) {
  const b = birthOf(id); if (!b) return '';
  return `${Number(b.slice(5,7))}월 ${Number(b.slice(8,10))}일`;
}
// 그 생일에 몇 살이 되는지(만 나이)
function turningAge(id, when) {
  const b = birthOf(id); if (!b) return 0;
  return when.getFullYear() - Number(b.slice(0,4));
}
function nextBirthday(id) {
  const b = birthOf(id); if (!b) return null;
  const t = today0(), m = Number(b.slice(5,7)), d = Number(b.slice(8,10));
  let x = new Date(t.getFullYear(), m-1, d);
  if (x < t) x = new Date(t.getFullYear()+1, m-1, d);
  return { date: x, days: Math.round((x - t) / 86400000) };
}
function bdayPeople() { return state.students.concat(LEADERS).filter(u => birthOf(u.id)); }
function upcomingBirthdays() {
  return bdayPeople().map(u => Object.assign({}, u, nextBirthday(u.id)))
    .sort((a,b) => a.days - b.days);
}
function todaysBirthdays() { return upcomingBirthdays().filter(u => u.days === 0); }
// 축하 글은 생일 앞뒤 이레 동안 열어 둔다.
function bdayOpen(id) {
  const n = nextBirthday(id); if (!n) return false;
  return n.days <= 7 || n.days >= 358;
}
function bdayYear(id) {
  const n = nextBirthday(id);
  return n ? String(n.date.getFullYear() - (n.days >= 358 ? 1 : 0)) : String(today0().getFullYear());
}
function addBdayMsg(id) {
  const ta = document.getElementById('bday-msg-' + id);
  const text = (ta ? ta.value : '').trim();
  if (!text) { toast('축하 한마디를 적어주세요'); return; }
  const year = bdayYear(id);
  const prev = getDoc('bday', id, year) || {};
  const msgs = (Array.isArray(prev.msgs) ? prev.msgs : []).concat([{
    by: currentUser, name: (findUser(currentUser)||{}).name || '', text, at: new Date().toISOString()
  }]);
  saveDoc('bday', id, year, { msgs, year }, '축하를 남겼어요!');
}
// 목사님만 지운다 — 장난 글이 남지 않도록.
function removeBdayMsg(id, idx) {
  if (!canManage()) return;
  const year = bdayYear(id);
  const prev = getDoc('bday', id, year) || {};
  const msgs = (Array.isArray(prev.msgs) ? prev.msgs : []).slice();
  msgs.splice(idx, 1);
  saveDoc('bday', id, year, { msgs, year }, '지웠습니다');
}

function bdayCard(u, big) {
  const year = bdayYear(u.id);
  loadDoc('bday', u.id, year);
  const doc = getDoc('bday', u.id, year);
  const msgs = doc && Array.isArray(doc.msgs) ? doc.msgs : [];
  const n = nextBirthday(u.id);
  const age = turningAge(u.id, n.date);
  const open = bdayOpen(u.id);
  return `<div class="card ${big ? 'bg-gradient-to-b from-amber-50 to-white border border-amber-200' : ''}">
    <div class="flex items-center gap-3">
      <div class="text-3xl">🎂</div>
      <div class="min-w-0 flex-1">
        <p class="text-base font-bold text-gray-900">${u.name}<span class="text-xs font-normal text-gray-500 ml-1">${u.role || (u.title ? '인도자' : '')}</span></p>
        <p class="text-xs text-gray-600 mt-0.5">${birthLabel(u.id)} · 만 ${age}세${n.days === 0 ? ' · <b class="text-amber-700">오늘입니다</b>' : ` · D-${n.days}`}</p>
      </div>
    </div>
    ${msgs.length ? `<div class="mt-3 space-y-1.5">
      ${msgs.map((m, k) => `<div class="bg-gray-50 rounded-xl px-3 py-2">
        <p class="text-sm text-gray-800 leading-relaxed whitespace-pre-wrap">${esc(m.text)}</p>
        <div class="flex items-center justify-between mt-1">
          <p class="text-[11px] text-gray-400">${esc(m.name)}</p>
          ${canManage() ? `<button onclick="removeBdayMsg('${u.id}',${k})" style="min-height:24px" class="text-[11px] text-red-400 px-1">지우기</button>` : ''}
        </div>
      </div>`).join('')}
    </div>` : (open ? `<p class="text-xs text-gray-400 mt-3">아직 축하 글이 없어요. 처음으로 남겨보세요!</p>` : '')}
    ${open ? `
      <textarea id="bday-msg-${u.id}" rows="2" placeholder="${u.name}에게 축하 한마디"
        class="w-full border rounded-xl p-3 text-sm resize-none mt-3"></textarea>
      <button onclick="addBdayMsg('${u.id}')" class="w-full mt-2 py-3 rounded-xl bg-gray-900 text-white font-bold text-sm">축하 남기기</button>`
    : ''}
  </div>`;
}

function renderBday() {
  const el = document.getElementById('page-bday');
  const list = bdayPeople();
  if (!list.length) {
    el.innerHTML = `<div class="card text-center py-10">
      <p class="text-3xl">🎂</p>
      <p class="text-sm text-gray-500 mt-2 font-semibold">아직 생일이 등록되지 않았어요</p>
      <p class="text-xs text-gray-400 mt-1">목사님께 말씀드리면 넣어주십니다</p>
    </div>`;
    return;
  }
  const today = todaysBirthdays();
  const soon = upcomingBirthdays().filter(u => u.days > 0).slice(0, 3);

  // 달별로 늘어놓는다 — 한 해 전체를 한눈에.
  const byMonth = {};
  list.forEach(u => {
    const m = Number(birthOf(u.id).slice(5,7));
    (byMonth[m] = byMonth[m] || []).push(u);
  });
  const thisMonth = today0().getMonth() + 1;
  const months = Object.keys(byMonth).map(Number).sort((a,b) => a-b).map(m => `
    <div class="flex gap-3 py-2 border-b last:border-0">
      <span class="text-xs font-bold ${m===thisMonth?'text-amber-600':'text-gray-400'} w-9 flex-shrink-0 mt-0.5">${m}월</span>
      <div class="min-w-0 flex-1 space-y-1">
        ${byMonth[m].sort((a,b) => birthOf(a.id).slice(5) < birthOf(b.id).slice(5) ? -1 : 1).map(u => `
          <div class="flex items-baseline gap-2">
            <span class="text-sm font-semibold text-gray-800">${u.name}</span>
            <span class="text-xs text-gray-500">${birthLabel(u.id)}</span>
            <span class="text-[11px] text-gray-400">${birthOf(u.id).slice(0,4)}년생</span>
            ${isLeader() && phoneOf(u.id) ? `<a href="tel:${phoneOf(u.id).replace(/-/g,'')}" class="text-[11px] text-blue-600 ml-auto">${esc(phoneOf(u.id))}</a>` : ''}
          </div>`).join('')}
      </div>
    </div>`).join('');

  el.innerHTML = `
    ${today.length ? `
      <div class="card bg-gray-900 text-center">
        <p class="text-3xl">🎉</p>
        <p class="text-white font-bold text-lg mt-1">오늘은 ${today.map(u=>u.name).join(' · ')} 생일!</p>
        <p class="text-white/60 text-xs mt-1">한 사람이 태어난 날은 하나님이 이 반에 그 사람을 주신 날입니다</p>
      </div>
      ${today.map(u => bdayCard(u, true)).join('')}
    ` : ''}

    ${soon.length ? `
    <div class="card">
      <h3 class="font-bold text-gray-800 text-sm mb-2">다가오는 생일</h3>
      ${soon.map(u => `
        <div class="flex items-center justify-between py-2 border-b last:border-0">
          <div class="min-w-0">
            <p class="text-sm font-semibold text-gray-800">${u.name}${u.role?` <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500 font-semibold">${u.role}</span>`:''}</p>
            <p class="text-[11px] text-gray-500 mt-0.5">${birthLabel(u.id)} · 만 ${turningAge(u.id, u.date)}세가 됩니다</p>
          </div>
          <span class="text-xs font-bold ${u.days<=7?'text-amber-600':'text-gray-400'} flex-shrink-0">D-${u.days}</span>
        </div>`).join('')}
    </div>` : ''}

    ${upcomingBirthdays().filter(u => u.days > 0 && u.days <= 7).map(u => bdayCard(u, false)).join('')}

    <div class="card">
      <h3 class="font-bold text-gray-800 text-sm mb-1">우리 반 생일</h3>
      <p class="text-[11px] text-gray-400 mb-2">${isLeader() ? '연락처는 목사님 화면에만 보입니다' : '생일 앞뒤 이레 동안 축하 글을 남길 수 있어요'}</p>
      ${months}
    </div>`;
}

// ==========================================
// 체크표
// ==========================================
// 한 사람 한 주 카드 — 홈(내 것)과 체크표(전체)가 같은 모양을 쓴다.
function checkCard(s, n, compact) {
  const wi = weekInfo(n);
  const a = attOf(s.id, n), smFri = sermonOf(s.id, n, 'fri'), smSun = sermonOf(s.id, n, 'sun'), dq = dqtDone(s.id, n);
  const edit = isLeader();
  const dotRow = (label, field, cls) => `

        const on = arrOf(field, s.id, n)[i];
        return `<div class="flex flex-col items-center gap-0.5 flex-1 min-w-0">
          <span class="text-[10px] ${i===0?'text-red-400':i===6?'text-blue-400':'text-gray-400'}">${w}</span>
          <div class="dot7 w-full ${on?cls:''} ${edit?'':'opacity-70'}" onclick="toggleDot('${field}','${s.id}',${n},${i})">${on?'✓':''}</div>
